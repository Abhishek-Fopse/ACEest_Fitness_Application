apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-blue-service
  namespace: aceest-fitness
spec:
  selector:
    app: aceest-fitness
    deployment-color: blue
  ports:
    - name: http
      port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-green-service
  namespace: aceest-fitness
spec:
  selector:
    app: aceest-fitness
    deployment-color: green
  ports:
    - name: http
      port: 80
      targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-fitness-primary
  namespace: aceest-fitness
spec:
  ingressClassName: nginx
  rules:
    - host: aceest-fitness.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-fitness-blue-service
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-fitness-variant-b
  namespace: aceest-fitness
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: "X-ACEest-Variant"
    nginx.ingress.kubernetes.io/canary-by-header-value: "B"
spec:
  ingressClassName: nginx
  rules:
    - host: aceest-fitness.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-fitness-green-service
                port:
                  number: 80
