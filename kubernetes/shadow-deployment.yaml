apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aceest-fitness-shadow-data
  namespace: aceest-fitness
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-shadow
  namespace: aceest-fitness
  labels:
    app: aceest-fitness
    deployment-role: shadow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      deployment-role: shadow
  template:
    metadata:
      labels:
        app: aceest-fitness
        deployment-role: shadow
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: aceest-fitness
          image: abhishekfopse/aceest-fitness:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: aceest-fitness-config
          env:
            - name: FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aceest-fitness-secret
                  key: flask-secret-key
            - name: ACEEST_DB_PATH
              value: /data/aceest_fitness.db
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: shadow-data
              mountPath: /data
      volumes:
        - name: shadow-data
          persistentVolumeClaim:
            claimName: aceest-fitness-shadow-data
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-shadow-service
  namespace: aceest-fitness
spec:
  selector:
    app: aceest-fitness
    deployment-role: shadow
  ports:
    - name: http
      port: 80
      targetPort: 5000
